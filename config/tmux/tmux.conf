# =============================================================================
# Tmux Configuration
# =============================================================================
# Terminal : Alacritty
# Status   : tmux-powerkit
# Sessions : tmux-resurrect + tmux-continuum
# Clipboard: tmux-yank (OSC 52)
# =============================================================================

# ---- Basic Settings ---------------------------------------------------------

set -g default-terminal     "tmux-256color"
set -g base-index           1
set -g pane-base-index      1
set -g renumber-windows     on
set -g history-limit        128000
set -g escape-time          0
set -g focus-events         on
set -g set-clipboard        on
set -g mouse                on
set -g extended-keys        on
set -g extended-keys-format csi-u
set -g set-titles           on

# ---- Terminal Features (tmux >= 3.2) ----------------------------------------
# These tell tmux what the OUTER terminal (Alacritty) supports.
# They're harmless on other terminals — unsupported features are ignored.

# Fallback Tc flag for older tmux versions / programs that check it
set -ga terminal-overrides ",*:Tc"

%if #{==:#{TERM},alacritty}
  # Colored underlines (Alacritty/Kitty)
  set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
  # Styled underlines (undercurl) — required for Neovim diagnostic underlines
  set -as terminal-features ",*:usstyle"
  # Hyperlink support (Alacritty, Kitty, iTerm2)
  set -as terminal-features ",*:hyperlinks"
%endif

# ---- Bell & Activity --------------------------------------------------------

set -g monitor-bell           on
set -g bell-action            other
set -g visual-bell            off
set -g monitor-activity       off
set -g activity-action        other

# ---- Vi Copy Mode -----------------------------------------------------------

set -g mode-keys vi
bind -T copy-mode-vi v       send-keys -X begin-selection
bind -T copy-mode-vi C-v     send-keys -X rectangle-toggle
bind -T copy-mode-vi y       send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Enter   send-keys -X copy-selection-and-cancel

bind -n PPage if-shell -F "#{alternate_on}" \
  "send-keys PPage" \
  "copy-mode -e; send-keys PPage"

# ---- Keybindings ------------------------------------------------------------

# New windows/panes open in the current pane's working directory
bind  c   neww             -c "#{pane_current_path}"
bind  %   split-window  -h -c "#{pane_current_path}"
bind '"'  split-window  -v -c "#{pane_current_path}"

# Vim-aware pane navigation (Ctrl+hjkl)
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?x?|git)(diff)?$"'
bind -n C-h   if-shell "$is_vim" "send-keys C-h"   "select-pane -L"
bind -n C-j   if-shell "$is_vim" "send-keys C-j"   "select-pane -D"
bind -n C-k   if-shell "$is_vim" "send-keys C-k"   "select-pane -U"
bind -n C-l   if-shell "$is_vim" "send-keys C-l"   "select-pane -R"
bind -n C-\\  if-shell "$is_vim" "send-keys C-\\"  "select-pane -l"

# Synchronize panes
bind  b  set-window-option synchronize-panes on
bind  B  set-window-option synchronize-panes off

# Session management
bind  s  choose-tree -sZ -O name
bind  S  command-prompt -p "New session name: " "new-session -s '%%'"

# Config reload
bind  r  source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Window switching (Alt+number)
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-0 select-window -t :=10

# Reorder windows
bind -n C-M-Left   swap-window -t -1 \; select-window -t -1
bind -n C-M-Right  swap-window -t +1 \; select-window -t +1

# ccmux
bind -n M-p display-popup -E -w 80% -h 75% "ccmux"

# ---- Plugins (TPM) ----------------------------------------------------------

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin "laktak/extrakto"

# ---- Plugin Configuration ---------------------------------------------------

# tmux-resurrect / continuum (automatic session persistence)
set -g @resurrect-dir           '~/.local/share/tmux/resurrect'
set -g @resurrect-processes     'man mc ncmcpp ranger rtorrent ssh sudo vim watch expect python ikhal neomutt mutt newsboat journalctl'
set -g @continuum-restore       'on'
set -g @continuum-save-interval '15'

# tmux-yank (clipboard via OSC 52)
set -g @yank_action 'copy-pipe'

# tmux-powerkit (status bar framework)

# Which built-in plugins to display (48 available — mix & match)
set -g @powerkit_plugins "group(cpu,memory,loadavg),group(git),datetime,battery"

# Theme
set -g @powerkit_theme           "iceberg"
set -g @powerkit_theme_variant   "light"
set -g @powerkit_transparent     "false"

# Separator style (normal, rounded, slant, flame, pixel, honeycomb, none)
set -g @powerkit_separator_style            "none"
set -g @powerkit_initial_separator_style    "none:all"
set -g @powerkit_edge_separator_style       "none"
set -g @powerkit_elements_spacing           "true"
set -g @powerkit_icon_padding               "3"

# Layout
set -g @powerkit_bar_layout        "single"
set -g @powerkit_status_order      "session,plugins"
set -g @powerkit_status_interval   "5"
set -g @powerkit_status_justify    "left"
set -g @powerkit_status_position   "bottom"

# Window index
set -g @powerkit_window_index_style          "text"
set -g @powerkit_window_index_padding        "false"
set -g @powerkit_active_window_show_index    "true"
set -g @powerkit_inactive_window_show_index  "true"

# Pane borders — PowerKit can style these too
set -g @powerkit_pane_border_lines    "single"
set -g @powerkit_pane_border_unified  "true"
set -g @powerkit_pane_border_color    "pane-border-active"
set -g @powerkit_pane_border_status   "top"
set -g @powerkit_pane_border_format   "{active} [{index}] {basename}"

# Caching (SWR — stale-while-revalidate)
set -g @powerkit_lazy_loading     "true"
set -g @powerkit_stale_multiplier "3"

# Interactive helper keybindings (prefix + key)
set -g @powerkit_show_options_key     "C-e"   # browse all options
set -g @powerkit_show_keybindings_key "C-y"   # view active keybindings
set -g @powerkit_theme_selector_key   "C-r"   # interactively switch theme

# Plugin configuration: git
set -g @powerkit_plugin_git_cache_ttl "5"

# ---- TPM Initialization (must be the last line) -----------------------------

set-environment -g TPACK_PLUGIN_PATH "$HOME/.config/tmux/plugins"
# run -b ~/.config/tmux/plugins/tpm/tpm
run 'tpack init'
